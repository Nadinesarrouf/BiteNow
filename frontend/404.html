<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BiteNow — Page Not Found</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .not-found-wrap {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1rem;
    }
    .not-found-emoji { font-size: 5rem; }
    .not-found-code  {
      font-size: 6rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
    }
    .not-found-msg   {
      font-size: 1.2rem;
      color: var(--muted);
      max-width: 380px;
    }
    .not-found-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">🍔 BiteNow</a>
    <nav>
      <a href="menu.html">Menu</a>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <div class="not-found-wrap">
    <div class="not-found-emoji">🍽️</div>
    <div class="not-found-code">404</div>
    <h1 style="font-size:1.5rem">Page not found</h1>
    <p class="not-found-msg">
      Looks like this page ran out of stock —
      just like the soup on a busy Friday.
    </p>
    <div class="not-found-actions">
      <a href="index.html" class="btn btn-primary">Go Home</a>
      <a href="menu.html"  class="btn btn-outline">Browse Menu</a>
    </div>
  </div>

</body>
</html>
