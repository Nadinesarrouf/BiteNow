<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiteNow — Sign Up</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ── Auth layout ───────────────────────────────── */
    .auth-wrapper {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--surface-muted, #F8F6F3);
    }

    .auth-card {
      background: #fff;
      border: 1px solid rgba(0,0,0,.09);
      border-radius: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 440px;
    }

    .auth-card h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: #1A1612;
    }

    .auth-card .subtitle {
      color: #6B6560;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    /* ── Form groups ───────────────────────────────── */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9E9892;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid rgba(0,0,0,.12);
      border-radius: 10px;
      font-size: 0.925rem;
      font-family: inherit;
      color: #1A1612;
      background: #fff;
      outline: none;
      transition: border-color 0.18s;
    }

    .form-group input:focus {
      border-color: #E85C2A;
    }

    .form-group input::placeholder {
      color: #C4BFB9;
    }

    /* ── Password wrapper (show/hide icon) ─────────── */
    .pw-wrap {
      position: relative;
    }

    .pw-wrap input {
      padding-right: 42px;
    }

    .pw-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9E9892;
      font-size: 17px;
      display: flex;
      align-items: center;
      padding: 0;
      transition: color 0.15s;
    }

    .pw-toggle:hover {
      color: #E85C2A;
    }

    /* ── Location row ──────────────────────────────── */
    .loc-row {
      display: flex;
      gap: 8px;
    }

    .loc-row input {
      flex: 1;
    }

    .detect-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 14px;
      height: 44px;
      border: 1.5px solid rgba(0,0,0,.12);
      border-radius: 10px;
      background: #FDF0EB;
      color: #E85C2A;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s, color 0.18s;
    }

    .detect-btn:hover {
      background: #E85C2A;
      color: #fff;
    }

    .detect-btn:disabled {
      opacity: 0.55;
      pointer-events: none;
    }

    .detect-btn .ti {
      font-size: 15px;
    }

    /* ── Geo status line ───────────────────────────── */
    .geo-status {
      margin-top: 5px;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 18px;
      color: #9E9892;
    }

    .geo-status.ok    { color: #226F38; }
    .geo-status.error { color: #921F1F; }

    .geo-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alerts ────────────────────────────────────── */
    .alert {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .alert.show { display: flex; }

    .alert-error {
      background: #FDECEC;
      color: #921F1F;
      border: 1px solid rgba(146,31,31,.15);
    }

    .alert-success {
      background: #EAF5ED;
      color: #226F38;
      border: 1px solid rgba(34,111,56,.15);
    }

    .alert .ti { font-size: 16px; flex-shrink: 0; }

    /* ── Submit button ─────────────────────────────── */
    #signup-btn {
      width: 100%;
      padding: 13px;
      background: #E85C2A;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.975rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.18s, opacity 0.18s;
      letter-spacing: 0.01em;
    }

    #signup-btn:hover    { background: #C44A1E; }
    #signup-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Footer link ───────────────────────────────── */
    .auth-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: #6B6560;
    }

    .auth-footer a {
      color: #E85C2A;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>

<body>

  <!-- ── Navbar ─────────────────────────────────────────── -->
  <div id="navbar-root"></div>

  <!-- ── Signup Form ────────────────────────────────────── -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <h1>Create account</h1>
      <p class="subtitle">Join BiteNow and start ordering in minutes.</p>

      <!-- Alerts -->
      <div class="alert alert-error" id="error-msg" role="alert" aria-live="assertive">
        <i class="ti ti-alert-circle" aria-hidden="true"></i>
        <span id="error-text"></span>
      </div>
      <div class="alert alert-success" id="success-msg" role="alert" aria-live="polite">
        <i class="ti ti-circle-check" aria-hidden="true"></i>
        <span id="success-text"></span>
      </div>

      <!-- Full Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your name" autocomplete="name" />
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com" autocomplete="email" />
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Your phone number" autocomplete="tel" />
      </div>

      <!-- Location with detect -->
      <div class="form-group">
        <label for="location">Delivery Location</label>
        <div class="loc-row">
          <input type="text" id="location" placeholder="e.g. Jounieh, Lebanon" autocomplete="off" />
          <button class="detect-btn" id="detect-btn" type="button" onclick="detectLocation()" aria-label="Detect my location">
            <i class="ti ti-map-pin" aria-hidden="true"></i>
            Detect
          </button>
        </div>
        <div class="geo-status" id="geo-status" aria-live="polite"></div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" />
          <button class="pw-toggle" type="button" onclick="togglePw('password', this)" aria-label="Toggle password visibility">
            <i class="ti ti-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm-password" placeholder="Repeat password" autocomplete="new-password" />
          <button class="pw-toggle" type="button" onclick="togglePw('confirm-password', this)" aria-label="Toggle confirm password visibility">
            <i class="ti ti-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button id="signup-btn" type="button" onclick="handleSignup()">
        Create Account
      </button>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/signup.js"></script>

</body>
</html>
