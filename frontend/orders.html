<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BiteNow — My Orders</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/orders.css"/>
  <style>
    .contact-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 900;
      background: rgba(30, 20, 15, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 10px 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .contact-bar__label {
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      white-space: nowrap;
    }
    .contact-bar__btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      border-radius: 100px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: inherit;
      white-space: nowrap;
      transition: opacity 0.15s;
      border: none;
      cursor: pointer;
    }
    .contact-bar__btn--wa {
      background: #25D366;
      color: #fff;
      box-shadow: 0 2px 8px rgba(37,211,102,0.35);
    }
    .contact-bar__btn--wa:hover { opacity: 0.85; }
    .contact-bar__btn--call {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .contact-bar__btn--call:hover { background: rgba(255,255,255,0.2); }

    /* push page content above the bar */
    body { padding-bottom: 62px; }
  </style>
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────── -->
  <header class="navbar">
    <a href="index.html" class="logo">🍔 BiteNow</a>
    <nav id="nav-links"></nav>
  </header>

  <!-- ── Page ───────────────────────────────────────────── -->
  <main class="page">
    <div class="orders-header">
      <h1 class="page-title">My Orders</h1>
      <button class="btn btn-outline btn-sm" onclick="loadOrders()">
        ⟳ Refresh
      </button>
    </div>

    <!-- Orders list injected here -->
    <div id="orders-container">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- ── Fixed contact bar ──────────────────────────────── -->
  <div class="contact-bar">
    <span class="contact-bar__label">Need help with your order?</span>

    <a href="https://wa.me/96103819412" target="_blank" rel="noopener" class="contact-bar__btn contact-bar__btn--wa">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.38 1.26 4.79L2 22l5.45-1.43a9.86 9.86 0 0 0 4.59 1.14c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2Zm5.52 14.15c-.23.65-1.33 1.24-1.84 1.32-.47.07-1.07.1-1.72-.11a15.7 15.7 0 0 1-1.56-.58c-2.73-1.18-4.51-3.93-4.65-4.12-.13-.18-1.1-1.46-1.1-2.79 0-1.32.69-1.97 1-2.24.28-.25.6-.31.8-.31l.58.01c.19 0 .44-.07.69.52.26.62.87 2.12.95 2.28.08.15.13.33.03.53-.1.2-.15.32-.3.5l-.45.52c-.15.15-.3.32-.13.62.17.3.76 1.25 1.63 2.02 1.12.99 2.06 1.3 2.36 1.44.3.14.47.12.64-.07.18-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.73.82 2.03.96.3.15.5.22.57.34.07.13.07.74-.16 1.39Z"/>
      </svg>
      WhatsApp us
    </a>

    <a href="tel:+96103819412" class="contact-bar__btn contact-bar__btn--call">
      📞 +961 03 819 412
    </a>
  </div>

  <!-- ── Toast ──────────────────────────────────────────── -->
  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
