<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BiteNow Admin — Orders</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>

  <!-- ── Top Navbar ─────────────────────────────────────── -->
  <header class="navbar">
    <a href="dashboard.html" class="logo">⚙️ BiteNow Admin</a>
    <nav id="nav-links"></nav>
  </header>

  <!-- ── Admin Layout ───────────────────────────────────── -->
  <div class="admin-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-title">Main</div>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="menu-manage.html">🍽️ Menu Items</a>
      <hr class="sidebar-divider"/>
      <div class="sidebar-title">Orders</div>
      <a href="orders.html" class="active">📋 All Orders</a>
      <hr class="sidebar-divider"/>
      <div class="sidebar-title">Account</div>
      <a href="../index.html">🍔 Customer View</a>
      <a href="#" onclick="adminLogout()">🚪 Logout</a>
    </aside>

    <!-- Main content -->
    <main class="admin-main">

      <!-- Header row -->
      <div style="display:flex;align-items:center;
                  justify-content:space-between;margin-bottom:1.5rem">
        <h1 class="page-title" style="margin:0">📋 All Orders</h1>
        <button class="btn btn-outline btn-sm" onclick="loadOrders()">
          🔄 Refresh
        </button>
      </div>

      <!-- Status filter pills -->
      <div class="category-pills" id="status-pills"
           style="margin-bottom:1.5rem"></div>

      <!-- Search bar -->
      <div style="margin-bottom:1.2rem">
        <input
          type="text"
          id="search-input"
          placeholder="🔍 Search by order # or customer name..."
          oninput="applyFilters()"
          style="padding:0.5rem 1rem;border:1px solid var(--border);
                 border-radius:var(--radius);font-size:0.92rem;
                 background:var(--surface);width:100%;max-width:400px"
        />
      </div>

      <!-- Orders table -->
      <div class="section-card">
        <div class="section-card-body">
          <div id="orders-wrap">
            <div class="spinner" style="margin:2rem auto"></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- ── Order Detail Modal ──────────────────────────────── -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal" style="max-width:560px">
      <button class="modal-close" onclick="closeDetailModal()">✕</button>
      <h2 id="detail-modal-title">Order Details</h2>
      <div id="detail-modal-body">
        <div class="spinner" style="margin:2rem auto"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/admin-orders.js"></script>
</body>
</html>
